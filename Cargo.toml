[workspace]
members = ["crates/core", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = ""

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri = "2"
tauri-build = "2"
reqwest = { version = "0.13", features = ["json", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "sync", "process", "time", "rt"] }
futures-util = "0.3"
async-trait = "0.1"
sha2 = "0.10"
hex = "0.4"
wiremock = "0.6"
tempfile = "3"
