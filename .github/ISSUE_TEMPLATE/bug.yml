name: Bug
description: Bug encontrado en revisión o en uso
labels: [bug]
body:
  - type: input
    id: plan
    attributes:
      label: Plan y tarea
      placeholder: docs/plans/003-descargas.md — T2
  - type: input
    id: location
    attributes:
      label: Ubicación
      placeholder: crates/core/src/download/mod.rs:42
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: Escenario que falla
      description: Pasos o entrada concreta
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Esperado vs obtenido
    validations:
      required: true
  - type: textarea
    id: test
    attributes:
      label: Test que lo reproduce
